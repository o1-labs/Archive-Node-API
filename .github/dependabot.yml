version: 2
updates:
  # Application dependencies. Production and development updates are grouped
  # separately so security-relevant runtime bumps are easy to review on their own.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  # Keep CI action versions current and patched.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'

  # Keep the pinned base-image digest in the Dockerfile fresh.
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Digest and patch refreshes stay automatic — that is the security value.
    # Moving the Node major is a breaking change under docs/versioning.md, and it
    # has to move together with the CI matrix and the docs, so it is made
    # deliberately rather than by an automated bump onto a Current release line.
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
