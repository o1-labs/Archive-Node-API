name: Smoke Load Test

# A short Artillery run against the static archive-DB fixture, asserting only
# loose bounds (p95 < 5s, error-rate < 1%, all 200s). NOT a perf benchmark —
# see benchmark/smoke.yaml for the rationale.

on:
  # Only run when something behaviorally relevant changes. Docs-only PRs
  # don't need ~2 min of runner time.
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'schema.graphql'
      - 'tests/integration/fixtures/**'
      - 'benchmark/smoke.yaml'
      - '.github/workflows/smoke-load-test.yaml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'schema.graphql'
      - 'tests/integration/fixtures/**'
      - 'benchmark/smoke.yaml'
      - '.github/workflows/smoke-load-test.yaml'

jobs:
  smoke-load:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Load fixture into Postgres
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE archive_smoke;'
          psql -h localhost -U postgres -d archive_smoke -f tests/integration/fixtures/archive_db.sql

      - name: Start API server
        env:
          PG_CONN: 'postgres://postgres:postgres@localhost:5432/archive_smoke'
          PORT: '8080'
        run: |
          nohup npm run start > server.log 2>&1 &
          echo $! > server.pid
          disown
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/healthcheck >/dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to come up within 30s"
          cat server.log
          exit 1

      - name: Run smoke load test
        # PR runs use the 30s default in benchmark/smoke.yaml. Pushes to main
        # override the phase to 5 minutes — a soak run before code lands /
        # ships. Same arrival rate either way; we want soak duration, not
        # higher peak load.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npx artillery run benchmark/smoke.yaml \
              --output benchmark/smoke-report.json \
              --overrides '{"config":{"phases":[{"duration":300,"arrivalRate":5,"name":"main-soak"}]}}'
          else
            npx artillery run benchmark/smoke.yaml --output benchmark/smoke-report.json
          fi

      - name: Upload report and server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-load-report
          path: |
            benchmark/smoke-report.json
            server.log
          if-no-files-found: ignore

      - name: Stop API server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
