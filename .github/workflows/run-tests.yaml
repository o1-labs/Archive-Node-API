name: Run Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # The matrix legs report as "Run-Tests (22)" / "Run-Tests (24)". The required
  # status check is named "Run-Tests", so the aggregate job below keeps that
  # name reporting — without it, a required check that no longer exists leaves
  # every PR waiting on a status that can never arrive.
  Run-Tests-matrix:
    name: Run-Tests (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the `engines` floor, 24 is what the container image ships.
        node-version: ['22', '24']
    services:
      mina-local-network:
        image: o1labs/mina-local-network:compatible-latest-lightnet
        env:
          NETWORK_TYPE: 'single-node'
          PROOF_LEVEL: 'none'
        ports:
          - 3085:3085
          - 5432:5432
          - 8080:8080
          - 8181:8181
          - 8282:8282
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Wait for Mina network readiness
        uses: o1-labs/wait-for-mina-network-action@1c9848ea7edb1c3d83484cc5056f5d16759b0aa6 # v1
        with:
          mina-graphql-port: 8080
          max-attempts: 60
          polling-interval-ms: 10000

      - name: Run tests
        run: npm run test

  # Aggregate: reports under the name the branch ruleset requires.
  Run-Tests:
    name: Run-Tests
    needs: Run-Tests-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on every matrix leg
        run: |
          result='${{ needs.Run-Tests-matrix.result }}'
          echo "matrix result: $result"
          [ "$result" = 'success' ] || exit 1
