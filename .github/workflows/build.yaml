name: Docker Build CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token for Workload Identity Federation
  packages: write # ghcr.io push on tag builds

env:
    GAR_LOCATION: europe-west3
    PROJECT_ID: o1labs-192920
    REGISTRY: euro-docker-repo
    NPM_REGISTRY_LOCATION: europe-southwest1-npm.pkg.dev
    NPM_REGISTRY: euro-npm

jobs:
  build-and-deploy:
    # This job authenticates to Google Cloud, publishes a dev npm package and
    # pushes a Docker image, so it only works where repository secrets are
    # available. GitHub passes no secrets to a pull request from a fork or from
    # Dependabot, so the job is skipped there instead of failing at the auth
    # step. Fork and Dependabot pull requests are still covered by Run-Tests,
    # Linting, unit-tests, smoke-load, npm audit and Check Schema.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    # ORDERING RULE: every step that runs dependency code (npm ci, npm run build)
    # comes BEFORE "Authenticate to Google Cloud". After that step only the
    # registry logins, npm publish and the docker build may run. See issue 03.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Build the head commit of the pull request rather than the merge
          # commit, which is what this job published before. The previous
          # `git fetch origin <head ref>` assumed the branch lived in this
          # repository and could not resolve a fork's branch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          # `scope` is load-bearing: it makes euro-npm the registry for
          # @o1-labs packages only, so `npm ci` keeps resolving every other
          # dependency from the public registry. setup-node writes its .npmrc
          # into $RUNNER_TEMP and points NPM_CONFIG_USERCONFIG at it, so no
          # credential file is ever created in the workspace. The real token is
          # supplied as NODE_AUTH_TOKEN by the publish step alone.
          registry-url: 'https://europe-southwest1-npm.pkg.dev/o1labs-192920/euro-npm/'
          scope: '@o1-labs'

      - name: Determine npm version
        id: determine_npm_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Save original version BEFORE any modifications
          ORIGINAL_VERSION=$(node -p "require('./package.json').version")
          echo "original_version=${ORIGINAL_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/* ]]; then
            # Release build - use version from package.json
            echo "version=${ORIGINAL_VERSION}" >> "$GITHUB_OUTPUT"
            echo "needs_version_update=false" >> "$GITHUB_OUTPUT"
            echo "Publishing release version from package.json: ${ORIGINAL_VERSION}"
          else
            # PR build - use dev version with SHA
            SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
            DEV_VERSION="${ORIGINAL_VERSION}-dev.${SHORT_SHA}"
            echo "version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
            echo "needs_version_update=true" >> "$GITHUB_OUTPUT"
            echo "Publishing dev version: ${DEV_VERSION}"
          fi

      - name: Update package version for dev builds
        if: steps.determine_npm_version.outputs.needs_version_update == 'true'
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = '${{ steps.determine_npm_version.outputs.version }}'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Assert no credential files in the workspace
        shell: bash
        run: |
          set -euo pipefail
          # `.env.example.compose` and `.env.example.lightnet` are committed,
          # secret-free templates and are excluded; every other dotenv or
          # credential file in the workspace root is a failure.
          found=$(find . -maxdepth 1 \( -name 'gha-creds-*.json' -o -name '.npmrc' -o -name '.env' -o \( -name '.env.*' ! -name '.env.example.*' \) \) -print)
          if [[ -n "$found" ]]; then
            echo "::error::credential file(s) present in workspace:"; echo "$found"; exit 1
          fi
          npm pack --dry-run --json --ignore-scripts | jq -r '.[0].files[].path' > "$RUNNER_TEMP/packed-files.txt"
          if grep -E '^(gha-creds|\.npmrc|\.env)' "$RUNNER_TEMP/packed-files.txt"; then
            echo "::error::npm would pack a credential file"; exit 1
          fi
          echo "npm pack would ship $(wc -l < "$RUNNER_TEMP/packed-files.txt") files:"; cat "$RUNNER_TEMP/packed-files.txt"

      # Keyless: the runner presents its GitHub OIDC token and receives a
      # 15-minute Google access token. `create_credentials_file: false` keeps
      # the credential out of $GITHUB_WORKSPACE (and therefore out of the npm
      # tarball and the Docker build context); nothing is stored in the
      # repository. The pool, provider and service account are declared in
      # gitops-infrastructure/platform/gcloud/service-accounts/workload-identity.tf.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/1020762690228/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: archive-node-api-ci@o1labs-192920.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          access_token_lifetime: 900s

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm registry
        env:
          # The token lives for this step only; setup-node's .npmrc in
          # $RUNNER_TEMP reads it from the environment.
          NODE_AUTH_TOKEN: ${{ steps.auth.outputs.access_token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/* ]]; then
            # Release version - publish with 'latest' tag
            npm publish --ignore-scripts --registry=https://europe-southwest1-npm.pkg.dev/o1labs-192920/euro-npm/ --tag latest
          else
            # Dev version - publish with 'dev' tag
            npm publish --ignore-scripts --registry=https://europe-southwest1-npm.pkg.dev/o1labs-192920/euro-npm/ --tag dev
          fi

      - name: Restore original package version for dev builds
        if: always() && steps.determine_npm_version.outputs.needs_version_update == 'true'
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = '${{ steps.determine_npm_version.outputs.original_version }}'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Assert no credential files in the workspace
        # Repeated deliberately: `docker/build-push-action` runs below with
        # `context: .`, so the workspace must be proven clean again after the
        # publish steps and before anything is packaged into an image layer.
        shell: bash
        run: |
          set -euo pipefail
          # `.env.example.compose` and `.env.example.lightnet` are committed,
          # secret-free templates and are excluded; every other dotenv or
          # credential file in the workspace root is a failure.
          found=$(find . -maxdepth 1 \( -name 'gha-creds-*.json' -o -name '.npmrc' -o -name '.env' -o \( -name '.env.*' ! -name '.env.example.*' \) \) -print)
          if [[ -n "$found" ]]; then
            echo "::error::credential file(s) present in workspace:"; echo "$found"; exit 1
          fi
          npm pack --dry-run --json --ignore-scripts | jq -r '.[0].files[].path' > "$RUNNER_TEMP/packed-files.txt"
          if grep -E '^(gha-creds|\.npmrc|\.env)' "$RUNNER_TEMP/packed-files.txt"; then
            echo "::error::npm would pack a credential file"; exit 1
          fi
          echo "npm pack would ship $(wc -l < "$RUNNER_TEMP/packed-files.txt") files:"; cat "$RUNNER_TEMP/packed-files.txt"

      # arm64 layers are built on an amd64 runner, so register the binfmt
      # handlers that let the runner execute aarch64 binaries. Must come before
      # buildx sets up the builder.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Determine tags
        id: determine_tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          GCP_IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY }}/archive-node-api"
          GITHUB_IMAGE="ghcr.io/${{ github.repository_owner }}/archive-node-api"

          if [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/* ]]; then
            # Release build from tag (e.g., v1.2.3)
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}  # Remove 'v' prefix

            # Generate GCP semantic version tags
            TAGS="${GCP_IMAGE}:${VERSION}"
            TAGS="${TAGS},${GCP_IMAGE}:latest"

            # Add GCP major.minor and major tags if it's a semantic version
            if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              TAGS="${TAGS},${GCP_IMAGE}:${MAJOR}.${MINOR}"
              TAGS="${TAGS},${GCP_IMAGE}:${MAJOR}"
            fi

            # Add GitHub Container Registry tags for releases
            TAGS="${TAGS},${GITHUB_IMAGE}:${VERSION}"
            TAGS="${TAGS},${GITHUB_IMAGE}:latest"

            # Add GitHub major.minor and major tags if it's a semantic version
            if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              TAGS="${TAGS},${GITHUB_IMAGE}:${MAJOR}.${MINOR}"
              TAGS="${TAGS},${GITHUB_IMAGE}:${MAJOR}"
            fi

            echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
            echo "Building release tags for GCP and GitHub: ${TAGS}"
          else
            # PR build - use dev tags with SHA (GCP only)
            SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
            FULL_TAG="${GCP_IMAGE}:dev-${COMMIT_SHA}"
            SHORT_TAG="${GCP_IMAGE}:dev-${SHORT_SHA}"
            echo "tags=${FULL_TAG},${SHORT_TAG}" >> "$GITHUB_OUTPUT"
            echo "Building dev tags (GCP only): ${FULL_TAG},${SHORT_TAG}"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # The pinned node:22-alpine digest is a multi-arch index that carries
          # linux/arm64/v8, so both architectures resolve from the same pin.
          # The Dockerfile keeps `npm ci` off the emulated path: see its header.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.determine_tags.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # always(): without it a failed build skips the rotation, and the post
      # step then saves the stale cache under the new key.
      - name: Move cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          [ -d /tmp/.buildx-cache-new ] && mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          exit 0
