# Reference Kubernetes manifest for the Archive Node API.
#
# This is a starting point, not a turnkey production deploy — review the image
# tag, replica count, resource sizing, and secret management for your cluster.
# See deploy/README.md and docs/security.md for the full deployment contract.
---
apiVersion: v1
kind: Secret
metadata:
  name: archive-node-api
type: Opaque
stringData:
  # Point at a read-only Postgres role (see docs/security.md). Replace before use.
  PG_CONN: 'postgres://archive_api_ro:CHANGE_ME@postgres:5432/archive'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archive-node-api
  labels:
    app: archive-node-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: archive-node-api
  template:
    metadata:
      labels:
        app: archive-node-api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: archive-node-api
          # Pin a specific version in production rather than :latest.
          image: ghcr.io/o1-labs/archive-node-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: PG_CONN
              valueFrom:
                secretKeyRef:
                  name: archive-node-api
                  key: PG_CONN
            # Restrict cross-origin access (see docs/security.md). Leave unset for
            # same-origin only, or set an explicit allowlist.
            # - name: CORS_ORIGIN
            #   value: 'https://app.example.com'
          resources:
            requests:
              cpu: '250m'
              memory: '256Mi'
            limits:
              cpu: '1'
              memory: '512Mi'
          # Liveness: process is up. Readiness: the database is reachable.
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      # Give in-flight requests time to drain on rollout (matches the app's
      # graceful-shutdown window).
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: archive-node-api
  labels:
    app: archive-node-api
spec:
  type: ClusterIP
  selector:
    app: archive-node-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: archive-node-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: archive-node-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
